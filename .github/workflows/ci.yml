name: CI

on:
  push:
    branches: [experimental]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (build, perft, search and strength regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build -j
      - name: Tests (perft, position, eval, search, tactical regression suite, UCI)
        run: ctest --test-dir engine/build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python-chess and pytest
        run: pip install python-chess pytest
      - name: Tests for the rating tools and sample opponents
        run: pytest -q engine/tools/test_regression.py
      - name: Strength regression (play the sample opponents, fail if the rating drops a lot)
        run: python engine/tools/regression.py --workers 4

  backend:
    name: Backend (pytest, including the real engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Build the engine (the backend tests also run against the real binary)
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build -j --target engine
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Test
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit tests (API client against mocked responses, board helpers)
        run: npm test
      - run: npm run build

  api-contract:
    name: Frontend <-> backend API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Build the engine
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build -j --target engine
      - name: Start the backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          ENGINE_MOVETIME_MS=100 nohup uvicorn main:app --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8000/docs > /dev/null && exit 0; sleep 1; done
          cat ../backend.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run the frontend's API client and Vite proxy against the live backend
        working-directory: frontend
        run: |
          npm ci
          VITE_BACKEND_URL=http://localhost:8000 npm test
      - name: Backend log
        if: failure()
        run: cat backend.log
